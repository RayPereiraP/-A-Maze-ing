# Folders that "flake8 ." and "mypy ." must skip: they hold code that is
# not part of this project (a local Python runtime, virtual environments,
# build results and a reference project).

[flake8]
extend-exclude = tmp,.venv,venv,build,dist,42_M02_A-Maze-Ing-main

[mypy]
exclude = ^(tmp|\.venv|venv|build|dist|42_M02_A-Maze-Ing-main)/
